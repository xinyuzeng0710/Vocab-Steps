<title>Vocab Steps！單字下樓梯</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft JhengHei",system-ui;background:#dff4ff}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#dff5ff 0 55%,#f5e7c9 55%)}
#hud{position:absolute;z-index:30;top:9px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-weight:900;color:#355a78}
#progress{background:#fff9;padding:5px 10px;border-radius:12px}
#word{position:absolute;z-index:25;top:7%;left:50%;transform:translateX(-50%);padding:7px 18px;border:3px solid #7697d5;border-radius:16px;background:#fffdf2e8;color:#36588f;font-size:clamp(20px,4vw,34px);font-weight:1000}
.platform{position:absolute;z-index:8;height:36px;border-radius:11px;background:linear-gradient(#fff8dc,#d9caa3);border:3px solid #89785a;box-shadow:0 6px #6d614d;display:flex;align-items:center;justify-content:center;font-weight:900;color:#40546a;font-size:clamp(12px,2vw,18px)}
.challenge{background:linear-gradient(#eef5ff,#bfd4ff);border-color:#6685bd}.good{background:#bceacb}.bad{background:#f3b0b0}

.head{position:absolute;left:8px;top:0;width:29px;height:28px;border-radius:50%;background:#ffd2b3;border:3px solid #71493a}.hair{position:absolute;left:7px;top:-2px;width:31px;height:15px;border-radius:18px 18px 6px 6px;background:#684536}.body{position:absolute;left:5px;top:26px;width:35px;height:30px;border-radius:9px;background:#edf8ff;border:3px solid #507ab7}
#controls{position:absolute;z-index:40;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:24px}.ctrl{width:min(36vw,190px);height:62px;border:0;border-radius:20px;background:#668bd4;color:#fff;font-size:22px;font-weight:1000;box-shadow:0 6px #4568aa;touch-action:none}.ctrl:active{transform:translateY(3px)}
#msg{position:absolute;z-index:50;left:50%;top:25%;transform:translate(-50%,-50%);padding:9px 16px;background:white;border-radius:14px;font-weight:1000;font-size:22px;opacity:0}
.overlay{position:absolute;z-index:100;inset:0;background:#eaf7fff3;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,580px);padding:24px;background:#fff;border:4px solid #a1c4ef;border-radius:28px;text-align:center;color:#50687c}.card h1{margin:0;color:#385f9d}
.sliderBox{text-align:left;margin:18px auto;max-width:430px;background:#f3f8ff;padding:12px 16px;border-radius:16px}.sliderBox label{display:flex;justify-content:space-between;font-weight:900;color:#426386;margin-bottom:7px}.sliderBox input{width:100%;accent-color:#668bd4}.marks{display:flex;justify-content:space-between;font-size:12px;color:#6b7d8e}
.start{border:0;border-radius:16px;padding:13px 34px;font-weight:900;font-size:21px;background:#5f88d4;color:white;box-shadow:0 6px #4267aa}

/* ===== ｜ visual refresh ===== */
#game{
  overflow:hidden;
  background:
    linear-gradient(90deg,rgba(255,255,255,.38) 0 2px,transparent 2px 100%),
    linear-gradient(#dff4ff 0 34%,#f8e8c9 34% 100%) !important;
}
#game::before{
  content:"";
  position:absolute; inset:0;
  pointer-events:none; z-index:0;
  background:
    linear-gradient(90deg,transparent 0 7%,rgba(255,255,255,.72) 7% 25%,transparent 25% 100%),
    linear-gradient(90deg,transparent 0 32%,rgba(255,255,255,.65) 32% 50%,transparent 50% 100%),
    linear-gradient(90deg,transparent 0 58%,rgba(255,255,255,.72) 58% 76%,transparent 76% 100%),
    repeating-linear-gradient(0deg,transparent 0 105px,rgba(85,112,158,.08) 106px 108px);
  opacity:.8;
}
#game::after{
  content:"SMALL STEPS  •  BIG PROGRESS";
  position:absolute; left:50%; top:17%;
  transform:translateX(-50%);
  z-index:1; pointer-events:none;
  padding:8px 18px; border-radius:14px;
  background:rgba(255,255,255,.72);
  color:#61759c; font-weight:900; letter-spacing:1px;
  box-shadow:0 5px 15px rgba(70,93,140,.12);
}
.platform{
  z-index:5 !important;
  border:3px solid rgba(255,255,255,.95) !important;
  border-radius:15px !important;
  box-shadow:0 6px 0 rgba(88,112,161,.28),0 10px 18px rgba(66,89,132,.16) !important;
  background:linear-gradient(180deg,#fffdf7,#f5d998) !important;
}
.platform.good{background:linear-gradient(180deg,#eaffea,#9be3a9)!important}
.platform.bad{background:linear-gradient(180deg,#fff0f0,#f4a6a6)!important}

#hud,#word{
  z-index:30 !important;
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  box-shadow:0 5px 16px rgba(54,79,125,.12);
}
#liveSettings{
  z-index:45 !important;
  width:auto !important;
  max-width:235px;
  padding:8px 10px !important;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 6px 18px rgba(50,70,110,.16);
}
#liveSettings label{font-size:12px}
#controls{z-index:40 !important}
.ctrl{
  box-shadow:0 5px 0 rgba(60,79,120,.22) !important;
  border:2px solid rgba(255,255,255,.9) !important;
}


/* ===== ｜ polished school-game UI ===== */
#game{
  background:
    linear-gradient(90deg,rgba(35,65,105,.12) 0 2px,transparent 2px),
    linear-gradient(180deg,#bfe6ff 0%,#eaf5fb 24%,#f3dfbc 24%,#f6ead5 100%) !important;
}
#game::before{
  background:
    linear-gradient(90deg,transparent 0 8%,rgba(255,255,255,.80) 8% 27%,transparent 27% 35%,rgba(255,255,255,.74) 35% 55%,transparent 55% 63%,rgba(255,255,255,.80) 63% 82%,transparent 82%),
    repeating-linear-gradient(0deg,transparent 0 110px,rgba(58,84,125,.09) 111px 114px) !important;
}

  transform-origin:left bottom !important;
  font-size:13px; color:#55729d !important;
}
.platform{
  background:linear-gradient(180deg,#fff9e9 0%,#ead8b5 62%,#b6bfd0 63%,#8d9bb2 100%) !important;
  border:2px solid rgba(255,255,255,.92) !important;
  box-shadow:0 5px 0 #65758f,0 10px 16px rgba(47,63,92,.22) !important;
}
.platform.good{background:linear-gradient(180deg,#efffed 0%,#bde9bc 62%,#8ca998 63%,#667f70 100%)!important}
.platform.bad{background:linear-gradient(180deg,#fff0ef 0%,#f0b7b4 62%,#aa858a 63%,#7d6469 100%)!important}
#hud{
  background:rgba(41,73,116,.91) !important;
  color:#fff !important; border:2px solid rgba(255,255,255,.72);
  border-radius:15px !important;
}
#word{
  background:rgba(255,255,255,.94) !important;
  color:#17375f !important; border:3px solid #5779b7 !important;
  border-radius:16px !important;
}
#liveSettings{
  display:none;
  background:rgba(255,255,255,.96) !important;
  color:#294d78 !important;
  right:10px !important; top:58px !important;
}
#liveSettings.open{display:block}
#gearBtn{
  position:absolute;z-index:46;right:12px;top:12px;width:46px;height:46px;
  border:2px solid rgba(255,255,255,.9);border-radius:14px;background:#5278b4;
  color:#fff;font-size:23px;box-shadow:0 5px 12px rgba(41,61,99,.22);cursor:pointer;
}
#brand{
  position:absolute;z-index:28;left:12px;top:12px;padding:7px 11px;
  border-radius:13px;background:rgba(255,255,255,.9);color:#315b8e;
  font-weight:1000;font-size:13px;line-height:1.05;text-align:center;
  border:2px solid rgba(83,120,180,.4);box-shadow:0 4px 10px rgba(42,64,100,.12);
}

function addP(px,py,pw=.23,text="",answer=""){let e=document.createElement("div");e.className="platform"+(answer?" challenge":"");e.style.left=px*100+"%";e.style.top=py*100+"%";e.style.width=pw*100+"%";e.textContent=text;game.append(e);let p={x:px,y:py,w:pw,e,answer};platforms.push(p);return p}

function spawnBottom(){let lowest=Math.max(...platforms.map(p=>p.y),.55),ny=Math.max(.88,lowest+.14),left=Math.random()<.5,nx=left?.07:(.66+Math.random()*.05);let challenge=(steps>0&&steps%2===1);if(challenge){

 addP(.67,ny+.04,.25,cl?wrong:q[1],cl?"bad":"ok")

function scroll(){let shift=landed.y-.40;if(shift<=0)return;platforms.forEach(p=>{p.y-=shift;p.e.style.top=p.y*100+"%"});y-=shift;platforms=platforms.filter(p=>{if(p.y<.12){p.e.remove();return false}return true});while(Math.max(...platforms.map(p=>p.y),0)<.92)spawnBottom();setTimeout(()=>render(),10)}

 if(p.answer && p.e.dataset.used!=="1"){
   p.e.dataset.used="1";
   if(p.answer==="ok"){score+=100;p.e.classList.add("good");flash("✅ 答對了！ +100")}

}

function restartGame(){
 running=false;
 document.querySelectorAll("#game > .overlay").forEach(o=>o.remove());
 steps=0;score=0;lives=3;challengeN=0;dir=0;vy=0;lastCounted=null;

 makeTrail();hud();render();updateCleanPlayer();
 running=true;last=performance.now();
 requestAnimationFrame(tick);
}
function end(){
 running=false;
 let floor=Math.floor(steps/10)+1,within=steps%10,o=document.createElement("div");
 o.className="overlay";
 o.innerHTML='<div class="card"><h1>挑戰結束</h1><p>完成 <b>'+Math.floor(steps/10)+'</b> 層，目前第 '+floor+' 層 '+within+'/10 階。<br>分數：<b>'+score+'</b></p><button class="start" id="playAgain">🔄 再玩一次</button></div>';

}

function updateCleanPlayer(){
 const p=document.querySelector("#player");
 if(!p)return;
 p.className="";
 if(!landed) p.classList.add("fall");
 else if(dir<0) p.classList.add("walk-left");
 else if(dir>0) p.classList.add("walk-right");
 else p.classList.add("idle");
}

function dropDown(){
 if(!running || !landed)return;
 landed=null;
 // DOWN 的初始下降速度直接跟著左右移動速度 moveSpeed。
 // 以目前 moveSpeed 的單位換算成適合 vy 的範圍。
 vy=Math.max(.018, moveSpeed*96);
 updateCleanPlayer();
}

function setDir(d){dir=d;updateCleanPlayer();if(landed){vy=.02;landed=null}}
const gameSpeed=document.querySelector("#gameSpeed"),speedText=document.querySelector("#speedText"),liveSpeed=document.querySelector("#liveSpeed");
function label(v){return v<=3?"慢":v<=6?"普通":v<=8?"快":"很快"}

function applyFloorSpeed(){
 const completedFloors=Math.floor(steps/10);
 const multiplier=Math.pow(1.08,completedFloors);
 moveSpeed=baseMoveSpeed*multiplier;
 gravity=baseGravity*multiplier;
}

function applyGameSpeed(v){
 v=Math.max(1,Math.min(10,Number(v)||5));
 baseMoveSpeed=.00028+v*.00007;
 baseGravity=(.12+v*.045)*3;
 applyFloorSpeed();
 gameSpeed.value=String(v);
 liveSpeed.value=String(v);
 speedText.textContent=label(v);
}
gameSpeed.addEventListener("input",()=>applyGameSpeed(gameSpeed.value));
liveSpeed.addEventListener("input",()=>applyGameSpeed(liveSpeed.value));
applyGameSpeed(5);
document.querySelector("#restart").onclick=()=>location.reload();
document.querySelector("#D").addEventListener("pointerdown",dropDown);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowDown" || e.key==="s" || e.key==="S"){
   e.preventDefault();
   dropDown();
 }
});
const settingsPanel=document.querySelector("#liveSettings");
document.querySelector("#gearBtn").onclick=()=>settingsPanel.classList.toggle("open");
document.querySelector("#closeSettings").onclick=()=>settingsPanel.classList.remove("open");
for(const [id,d] of [["L",-1],["R",1]]){let b=document.querySelector("#"+id);b.addEventListener("pointerdown",e=>{e.preventDefault();setDir(d)});b.addEventListener("pointerup",()=>dir=0);b.addEventListener("pointercancel",()=>dir=0);b.addEventListener("pointerleave",()=>dir=0)}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")setDir(-1);if(e.key==="ArrowRight")setDir(1)});document.addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight"].includes(e.key))dir=0});
document.querySelector("#go").onclick=()=>{document.querySelector("#start").remove();size();makeTrail();hud();render();running=true;last=performance.now();requestAnimationFrame(tick)};window.addEventListener("resize",()=>{size();render()});
