<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Stair Challenge｜英文單字下樓梯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#17223b}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#bfe8ff 0 28%,#eef8ff 28% 55%,#e8d9bd 55% 59%,#f6e8cd 59%);touch-action:none}
#game:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13%,#6685aa22 13% 14%)}
.window{position:absolute;left:6%;top:20%;width:27%;height:33%;border:8px solid #fff;background:linear-gradient(#8fd2ff,#e6f7ff);box-shadow:0 6px 15px #5577a744}
.rail{position:absolute;right:-3%;top:32%;width:62%;height:8px;background:#7188a5;transform:rotate(-20deg)}
.quote{position:absolute;right:6%;top:19%;background:#fffbe7dd;color:#5570a4;padding:.7em 1em;border-radius:14px;font-weight:800}
.hud{position:absolute;z-index:20;top:2.5%;left:3%;right:3%;display:flex;justify-content:space-between;color:#fff}
.badge{background:#345fa8e8;border:2px solid #fff9;border-radius:18px;padding:.55em .8em;font-weight:900;box-shadow:0 5px 0 #1f417d}
.wordbox{position:absolute;z-index:20;top:10%;left:50%;transform:translateX(-50%);width:min(520px,72%);text-align:center;background:#fffdf2f2;border:4px solid #6e8dd8;border-radius:22px;padding:.55em;box-shadow:0 8px 18px #0003}
#word{font-size:clamp(24px,4vw,50px);font-weight:1000;color:#2853a0}
.hint{font-size:clamp(11px,1.4vw,17px);color:#68728b}
#player{position:absolute;z-index:14;left:45%;top:26%;width:9%;aspect-ratio:1;border-radius:48% 48% 42% 42%;background:linear-gradient(#7a4c30 0 25%,#ffe1c7 25% 47%,#edf5ff 47% 70%,#4d80c9 70%);border:3px solid #fff;box-shadow:0 7px 10px #0004}
.platform{position:absolute;z-index:10;width:21%;height:10%;display:grid;place-items:center;padding:.5em;background:linear-gradient(#f8f4e8,#b9b4a8);border:4px solid #807a70;border-radius:50% 50% 18px 18px;color:#253754;font-weight:1000;font-size:clamp(12px,1.7vw,22px);text-align:center;box-shadow:0 9px 0 #69645d,0 14px 18px #0004}
.controls{position:absolute;z-index:30;left:0;right:0;bottom:2.5%;display:flex;justify-content:center;gap:5%}
.ctrl{width:19%;min-width:90px;padding:.7em;border:3px solid #fff9;border-radius:22px;background:#346bd0e8;color:#fff;font-size:clamp(17px,2.5vw,30px);font-weight:1000;box-shadow:0 6px 0 #1b4086;touch-action:none}
.ctrl:active{transform:translateY(4px)}
.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:#17305ed9;padding:5%}
.card{width:min(650px,90%);background:#fffdf4;border:5px solid #85a7ff;border-radius:30px;padding:5%;text-align:center;box-shadow:0 20px 50px #0007}
.card h1{margin:.1em;color:#2a55a1;font-size:clamp(28px,5vw,55px)}
.card p{color:#56627a;line-height:1.55}
.start{border:0;border-radius:18px;background:#ffd65b;color:#5a4100;padding:.75em 1.7em;font-weight:1000;font-size:clamp(18px,2.5vw,28px);box-shadow:0 6px 0 #c99a25;touch-action:manipulation}
#toast{position:absolute;z-index:40;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,58px);font-weight:1000;color:#fff;text-shadow:0 4px 8px #000;opacity:0;pointer-events:none}
@media(max-aspect-ratio:1/1){
body{display:block}#game{width:100vw;height:100dvh;aspect-ratio:auto}.quote{font-size:11px;top:20%}.window{width:42%;height:30%;top:23%}
.wordbox{top:9%;width:86%}#word{font-size:clamp(28px,8vw,44px)}#player{width:18%;top:26%}.platform{width:42%;height:9%;font-size:clamp(14px,4vw,20px)}
.controls{bottom:max(2.5%,env(safe-area-inset-bottom));gap:7%}.ctrl{width:38%;min-width:0}.card{width:88%;padding:8% 6%}}
</style>
</head>
<body>
<main id="game">
<div class="window"></div><div class="rail"></div><div class="quote">Small Steps Make Big Progress</div>
<div class="hud"><div class="badge">⭐ <span id="score">0</span></div><div class="badge">❤️ <span id="lives">3</span>　📘 <span id="progress">1/5</span></div></div>
<div class="wordbox"><div id="word">WORD STAIR</div><div class="hint">落到正確的中文意思！</div></div>
<div id="player"></div><div id="toast"></div>
<div class="controls"><button class="ctrl" id="left">◀ LEFT</button><button class="ctrl" id="right">RIGHT ▶</button></div>
<div class="overlay" id="start"><div class="card"><h1>WORD STAIR</h1><p><b>英文單字下樓梯</b></p><p>看上方英文單字，控制小朋友落到正確的中文平台。<br>手機／平板按 LEFT、RIGHT；電腦用 ←、→。</p><button class="start" id="startBtn">START ▶</button></div></div>
</main>
<script>
const Q=[
{w:"purchase",a:0,c:["購買","保護","生產","提供"]},
{w:"employee",a:2,c:["雇主","顧客","員工","經理"]},
{w:"equipment",a:1,c:["經驗","設備","環境","教育"]},
{w:"improve",a:2,c:["避免","減少","改善；進步","包含"]},
{w:"efficient",a:3,c:["昂貴的","危險的","傳統的","有效率的"]}
];
let i=0,score=0,lives=3,playing=false,locked=false,x=.45,y=.26,vx=0,vy=0,plats=[];
const g=document.querySelector("#game"),p=document.querySelector("#player"),word=document.querySelector("#word"),sc=document.querySelector("#score"),lv=document.querySelector("#lives"),prog=document.querySelector("#progress"),toast=document.querySelector("#toast");
const portrait=()=>matchMedia("(max-aspect-ratio:1/1)").matches;
function clearP(){plats.forEach(v=>v.el.remove());plats=[]}
function build(){
 if(i>=Q.length||lives<=0)return end();
 clearP();let q=Q[i];word.textContent=q.w;prog.textContent=(i+1)+"/5";
 let pos=portrait()?[{x:.04,y:.55},{x:.54,y:.55},{x:.04,y:.68},{x:.54,y:.68}]:[{x:.03,y:.65},{x:.275,y:.65},{x:.52,y:.65},{x:.765,y:.65}];
 q.c.forEach((t,n)=>{let e=document.createElement("div");e.className="platform";e.textContent=t;e.style.left=pos[n].x*100+"%";e.style.top=pos[n].y*100+"%";g.append(e);plats.push({el:e,x:pos[n].x,y:pos[n].y,w:portrait()?.42:.21,n})});
 reset();
}
function reset(){x=.45;y=.26;vx=0;vy=0;locked=false;draw()}
function choose(v){
 if(locked)return;locked=true;let ok=v.n===Q[i].a;
 if(ok){score+=100;toast.textContent="✓ 正確！"}else{lives--;toast.textContent="✕ 再試試看"}
 sc.textContent=score;lv.textContent=lives;toast.style.opacity=1;
 setTimeout(()=>{toast.style.opacity=0;i++;build()},650)
}
function end(){
 playing=false;clearP();let o=document.createElement("div");o.className="overlay";
 o.innerHTML='<div class="card"><h1>'+(lives>0?"🎉 FINISH!":"💫 GAME OVER")+'</h1><p>你的分數：<b>'+score+'</b> 分</p><button class="start" id="again">PLAY AGAIN ↻</button></div>';
 g.append(o);o.querySelector("#again").onclick=()=>{o.remove();i=0;score=0;lives=3;sc.textContent=0;lv.textContent=3;playing=true;build()}
}
function draw(){p.style.left=x*100+"%";p.style.top=y*100+"%"}
function move(d){if(playing&&!locked)vx+=d*.006}
function tick(){
 if(playing&&!locked){
  vy+=.0005;x+=vx;y+=vy;vx*=.88;x=Math.max(.01,Math.min(portrait()?.80:.90,x));
  let cx=x+(portrait()?.09:.045),feet=y+(portrait()?.12:.09);
  if(vy>0)for(let v of plats)if(feet>=v.y&&feet<=v.y+.05&&cx>v.x&&cx<v.x+v.w){choose(v);break}
  if(y>.94){lives--;lv.textContent=lives;toast.textContent="💔 沒接到平台！";toast.style.opacity=1;locked=true;setTimeout(()=>{toast.style.opacity=0;if(lives<=0)end();else reset()},650)}
  draw()
 }
 requestAnimationFrame(tick)
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
for(const [id,d] of [["left",-1],["right",1]]){
 let b=document.querySelector("#"+id),t;
 let down=e=>{e.preventDefault();move(d);t=setInterval(()=>move(d),55)},up=e=>{e.preventDefault();clearInterval(t)};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up)
}
document.querySelector("#startBtn").addEventListener("click",()=>{document.querySelector("#start").remove();playing=true;build()});
tick();
</script>
</body>
</html>
