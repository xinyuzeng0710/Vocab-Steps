@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#message{position:absolute;z-index:30;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(20px,4vw,52px);color:white;text-shadow:0 4px 8px #000;opacity:0;transition:.15s;pointer-events:none}
.controls{position:absolute;z-index:25;bottom:2.2%;left:0;right:0;display:flex;justify-content:center;gap:4%}
.ctrl{position:relative;z-index:100;pointer-events:auto;touch-action:manipulation;-webkit-appearance:none;cursor:pointer;width:18%;min-width:86px;padding:.65em;border:none;border-radius:22px;background:#2d67cde8;color:white;font-size:clamp(16px,2.5vw,30px);font-weight:900;border:3px solid #fff9;box-shadow:0 6px 0 #173b7d;touch-action:none}
.ctrl:active{transform:translateY(4px);box-shadow:0 2px 0 #173b7d}
.overlay{position:absolute;inset:0;z-index:50;background:#13264cdd;display:grid;place-items:center;padding:5%}
.card{width:min(680px,90%);background:#fffdf4;border:6px solid #7aa3ff;border-radius:32px;padding:5%;text-align:center;box-shadow:0 20px 50px #0007}
.card h1{margin:.1em 0;color:#2855a2;font-size:clamp(28px,5vw,58px)}
.card p{color:#4c5870;font-size:clamp(14px,2vw,22px);line-height:1.5}
.start{position:relative;z-index:100;pointer-events:auto;touch-action:manipulation;-webkit-appearance:none;cursor:pointer;border:0;border-radius:20px;background:#ffd65b;color:#563e00;font-weight:900;font-size:clamp(18px,2.5vw,30px);padding:.7em 1.6em;box-shadow:0 6px 0 #c99722}
.small{font-size:.82em;color:#71809c}
@media (max-aspect-ratio:1/1){
  body{display:block;background:#17223b}
  #game{width:100vw;height:100dvh;min-height:100svh;aspect-ratio:auto;background-position:center center}
  .hud{top:2%;left:3%;right:3%}
  .badge{font-size:clamp(12px,3.5vw,18px);padding:.5em .65em;border-width:2px}
  #wordBox{top:10%;width:84%;min-width:0;padding:.65em .8em}
  #word{font-size:clamp(28px,8vw,44px)}
  #hint{font-size:clamp(12px,3.3vw,17px)}
  #player{width:22%;top:25%}
  .platform{width:43%;height:11%;font-size:clamp(13px,4vw,20px);padding:2.5% 3% 0}
  .controls{bottom:max(2.5%,env(safe-area-inset-bottom));gap:7%}
  .ctrl{width:38%;min-width:0;padding:.8em .3em;font-size:clamp(18px,5vw,26px)}
  .card{width:88%;max-height:76dvh;overflow:auto;padding:8% 6%;border-width:4px}
  .card h1{font-size:clamp(30px,10vw,48px)}
  .card p{font-size:clamp(14px,4vw,19px)}
}
</style>

  <div id="message"></div>
  <div class="controls"><button class="ctrl" id="left">◀ LEFT</button><button class="ctrl" id="right">RIGHT ▶</button></div>
  <div class="overlay" id="startScreen">
    <div class="card"><h1>WORD STAIR</h1><p>英文單字下樓梯</p><p>看上方英文單字，控制小朋友落到正確的中文平台。<br>電腦：← →　手機：按下方左右鍵</p><button class="start" id="startBtn">START ▶</button><p class="small">5 題測試版・答對 +100 分</p></div>
  </div>
</div>
<script>
const questions=[
{word:"purchase",answer:"購買",choices:["購買","保護","生產","提供"]},
{word:"employee",answer:"員工",choices:["雇主","顧客","員工","經理"]},
{word:"equipment",answer:"設備",choices:["經驗","設備","環境","教育"]},
{word:"improve",answer:"改善；進步",choices:["避免","減少","改善；進步","包含"]},
{word:"efficient",answer:"有效率的",choices:["昂貴的","危險的","傳統的","有效率的"]}
];
const game=document.querySelector("#game"), player=document.querySelector("#player");
const wordEl=document.querySelector("#word"), scoreEl=document.querySelector("#score"), livesEl=document.querySelector("#lives"), progressEl=document.querySelector("#progress"), msg=document.querySelector("#message");
let idx=0,score=0,lives=3,x=.45,y=.24,vx=0,vy=0,playing=false,locked=false,platforms=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function clearPlatforms(){platforms.forEach(p=>p.el.remove());platforms=[]}
function buildQuestion(){
 clearPlatforms(); locked=false; x=.45;y=.24;vx=0;vy=0;
 const q=questions[idx]; wordEl.textContent=q.word; progressEl.textContent=`${idx+1}/5`;
 const choices=shuffle(q.choices);
 const portrait=window.matchMedia("(max-aspect-ratio:1/1)").matches;
 const positions=portrait
   ? [{x:.04,y:.56},{x:.53,y:.56},{x:.04,y:.70},{x:.53,y:.70}]
   : [{x:.03,y:.66},{x:.275,y:.66},{x:.52,y:.66},{x:.765,y:.66}];
 const pw=portrait ? .43 : .21, ph=portrait ? .11 : .14;
 choices.forEach((c,i)=>{
  const el=document.createElement("div");el.className="platform";el.textContent=c;
  el.style.left=(positions[i].x*100)+"%";el.style.top=(positions[i].y*100)+"%";game.appendChild(el);
  platforms.push({el,x:positions[i].x,y:positions[i].y,w:pw,h:ph,text:c});
 });
 updatePlayer();
}
function updatePlayer(){player.style.left=(x*100)+"%";player.style.top=(y*100)+"%";player.style.transform=`rotate(${vx*16}deg)`}
function flash(t){msg.textContent=t;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,650)}
function resolve(p){
 if(locked)return;locked=true;
 const q=questions[idx], ok=p && p.text===q.answer;
 if(ok){score+=100;p.el.classList.add("correct");flash("✓ CORRECT!");}
 else{lives--;if(p)p.el.classList.add("wrong");flash(p?"✕ TRY AGAIN":"MISS!");}
 scoreEl.textContent=score;livesEl.textContent=lives;
 setTimeout(()=>{
  if(lives<=0)return endGame(false);
  idx++;
  if(idx>=questions.length)return endGame(true);
  buildQuestion();
 },850);
}
function endGame(done){
 playing=false;clearPlatforms();
 const ov=document.createElement("div");ov.className="overlay";
 ov.innerHTML=`<div class="card"><h1>${done?"🎉 FINISH!":"💫 GAME OVER"}</h1><p>你的分數：<b>${score}</b> 分</p><p>${done?"你完成了 5 個英文單字！":"再挑戰一次，把單字救回來！"}</p><button class="start">PLAY AGAIN ↻</button></div>`;
 game.appendChild(ov);
 const replay=ov.querySelector("button");
 const again=(e)=>{if(e){e.preventDefault();e.stopPropagation();}ov.remove();idx=0;score=0;lives=3;scoreEl.textContent=0;livesEl.textContent=3;playing=true;buildQuestion();};
 replay.addEventListener("click",again,{passive:false});
 replay.addEventListener("touchend",again,{passive:false});
}
function tick(){
 if(playing&&!locked){
  vy+=.00055; x+=vx; y+=vy; vx*=.88; const portrait=window.matchMedia("(max-aspect-ratio:1/1)").matches; x=clamp(x,.01,portrait?.77:.89);
  // landing test
  if(vy>0){
   const portrait=window.matchMedia("(max-aspect-ratio:1/1)").matches; const px=x+(portrait?.11:.05), feet=y+(portrait?.16:.095);
   for(const p of platforms){
    if(feet>=p.y+.015 && feet<=p.y+.065 && px>p.x && px<p.x+p.w){resolve(p);break}
   }
  }
  if(y>.93)resolve(null);
  updatePlayer();
 }
 requestAnimationFrame(tick);
}
function move(dir){if(playing&&!locked)vx+=dir*.006}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
["left","right"].forEach((id,i)=>{
 const b=document.getElementById(id),dir=i?1:-1;
 let timer;
 const start=e=>{e.preventDefault();move(dir);timer=setInterval(()=>move(dir),55)};
 const stop=e=>{e.preventDefault();clearInterval(timer)};
 b.addEventListener("pointerdown",start);b.addEventListener("pointerup",stop);b.addEventListener("pointercancel",stop);b.addEventListener("pointerleave",stop); b.addEventListener("touchstart",start,{passive:false});b.addEventListener("touchend",stop,{passive:false});
});
function startGame(e){
 if(e){e.preventDefault();e.stopPropagation();}
 const s=document.querySelector("#startScreen");
 if(s) s.style.display="none";
 idx=0; score=0; lives=3;
 scoreEl.textContent=0; livesEl.textContent=3;
 playing=true; buildQuestion();
}
const startBtn=document.querySelector("#startBtn");
startBtn.addEventListener("click",startGame,{passive:false});
startBtn.addEventListener("touchend",startGame,{passive:false});
tick();
</script>
